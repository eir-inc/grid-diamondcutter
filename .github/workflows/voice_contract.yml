name: voice-contract

on:
  pull_request:
    paths:
      - 'examples/voices/**'
      - 'tests/test_voice_registry_contract.py'
      - 'meta_sim/**'
      - 'power_grid_sim*.py'
  push:
    branches: [main]
    paths:
      - 'examples/voices/**'
      - 'tests/test_voice_registry_contract.py'
      - 'meta_sim/**'
      - 'power_grid_sim*.py'

jobs:
  voice-contract-test:
    name: §3.1 voice-registry conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run voice-registry contract tests
        run: |
          python -m pytest tests/test_voice_registry_contract.py -v

      - name: Run full test suite
        run: |
          python -m pytest -q

      - name: Regenerate registry summary
        run: |
          python tools/registry_summary.py --output REGISTRY_STATUS.md
          # The summary is auto-regenerated on every CI run; reviewers can check
          # the diff against the committed REGISTRY_STATUS.md to see how a new
          # voice changes the base rate before the PR is merged.

      - name: Report registry diff
        run: |
          if ! git diff --quiet REGISTRY_STATUS.md; then
            echo "::notice::This PR changes the registry status. Review the diff below."
            git diff REGISTRY_STATUS.md
          else
            echo "::notice::No registry-status change in this PR."
          fi

      - name: Fail on sidecar tampering
        run: |
          # Each sidecar carries a SHA-256 over its pre-verdict canonical
          # serialization. Re-running every voice and comparing the regenerated
          # sidecar's hash to the committed hash catches post-verdict tampering.
          for voice in examples/voices/*.py; do
            if [[ "$(basename $voice)" == _* ]] || [[ "$(basename $voice)" == __* ]]; then
              continue
            fi
            python "$voice" > /dev/null 2>&1 || echo "::warning::voice $voice failed to run"
          done
